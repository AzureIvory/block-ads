<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>名单管理</title>
  <link rel="icon" href="icon.ico">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">
  <!-- 顶部栏 -->
  <header class="appbar">
    <div class="brand">
      <img src="icon.ico" class="brand-ico" onerror="this.style.display='none';">
      <div class="brand-name">名单管理</div>
    </div>

    <div class="appbar-mid">
      <!-- 启动/停止：按钮会自动切换文案与样式 -->
      <button id="btnRun" class="btn btn-primary">
        <span class="ico-play">▶</span>
        启动
      </button>

      <!-- 兼容旧逻辑：保留 stop 按钮（默认隐藏，不影响功能） -->
      <button id="btnStop" class="btn btn-danger-outline" style="display:none;">停止</button>

      <label class="chk-box">
        <input type="checkbox" id="chkBoot">
        <span>开机自启</span>
      </label>

      <span id="admTxt" class="pill pill-muted">...</span>
      <span id="runTxt" class="pill pill-muted">...</span>
    </div>

    <div class="appbar-right">
      <button id="btnFake" class="btn btn-ghost">一键伪装</button>
      <button id="btnHelp" class="btn btn-ghost">使用指南</button>
      <button id="btnGit" class="btn btn-ghost">GitHub</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧导航 -->
    <aside class="sidebar">
      <nav class="side-nav">
        <button class="side-item tab act" data-key="sign">
          <span>签名黑名单</span>
          <span class="badge" id="cnt-sign">0</span>
        </button>
        <button class="side-item tab" data-key="folder">
          <span>目录黑名单</span>
          <span class="badge" id="cnt-folder">0</span>
        </button>
        <button class="side-item tab" data-key="whitelist">
          <span>目录白名单</span>
          <span class="badge" id="cnt-whitelist">0</span>
        </button>
        <button class="side-item tab" data-key="signWhite">
          <span>签名白名单</span>
          <span class="badge" id="cnt-signWhite">0</span>
        </button>
      </nav>

      <div class="side-footer">
        <button id="btnSync" class="btn btn-sec btn-block">同步</button>
        <button id="btnUpdate" class="btn btn-sec btn-block">更新</button>
        <button id="btnAbout" class="btn btn-sec btn-block">关于</button>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content">
      <div class="toolbar">
        <div class="search">
          <span class="ico-search">🔎</span>
          <input id="srch" class="inp inp-search" type="text" placeholder="搜索...">
        </div>

        <div class="toolbar-actions">
          <button id="btnAdd" class="btn btn-primary">+ 新增</button>
          <button id="btnDel" class="btn btn-danger-outline">删除</button>
        </div>
      </div>

      <!-- 规则列表 -->
      <section class="card">
        <div class="card-head">
          <div class="card-title">规则列表 <span id="lstCnt" class="muted">(0)</span></div>
          <div id="lstSta" class="muted">已加载</div>
        </div>

        <div class="table-head">
          <label class="cb">
            <input type="checkbox" disabled>
            <span></span>
          </label>
          <div class="th">规则详情</div>
          <div class="th th-right">备注</div>
        </div>

        <div class="lst-box" id="lstBox">
          <ul id="lst"></ul>
        </div>
      </section>

      <!-- 日志 -->
      <section class="card">
        <div class="card-head">
          <div class="card-title">每日拦截记录</div>
          <div id="logInfo" class="muted"></div>
        </div>
        <div class="log-box">
          <ul id="logLst"></ul>
        </div>
        <div class="card-foot">
          <div class="svc" id="svcTxt">● 服务状态：<span id="svcSta">未知</span></div>
          <div class="mode" id="modeTxt">-</div>
        </div>
      </section>

      <div class="msg" id="msg"></div>
    </main>
  </div>

  <!-- 新增弹窗 -->
  <div class="modal" id="mdlAdd" aria-hidden="true">
    <div class="modal-mask" data-act="close"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="新增规则">
      <div class="modal-head">
        <div class="modal-title">新增规则</div>
        <button class="btn btn-ghost btn-sm" id="btnAddClose">关闭</button>
      </div>
      <div class="modal-body">
        <div class="muted" id="addHint">请输入要新增的内容</div>
        <input id="newL" class="inp inp-full" type="text" placeholder="新增一行内容">
      </div>
      <div class="modal-foot">
        <button class="btn btn-sec" id="btnAddCancel">取消</button>
        <button class="btn btn-primary" id="btnAddOk">确定添加</button>
      </div>
    </div>
  </div>

  <!-- 同步弹窗（覆盖式，不跳转页面） -->
  <div class="modal" id="mdlSync" aria-hidden="true">
    <div class="modal-mask" data-act="close-sync"></div>
    <div class="modal-panel modal-wide" role="dialog" aria-modal="true" aria-label="同步">
      <div class="modal-head">
        <div class="modal-head-left">
          <div class="modal-title">同步</div>
          <div class="modal-sub" id="syncSub">用于同步黑白名单库与注释</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnSyncClose">关闭</button>
      </div>

      <div class="modal-body modal-scroll">
        <div class="u-row">
          <div class="pill pill-muted" id="syncAt">未检查</div>
          <div class="u-actions">
            <button class="btn btn-ghost" id="btnSyncCheck">检查同步</button>
          </div>
        </div>
        <div class="u-notes" id="syncNotes"></div>

        <div class="u-toolbar">
          <div class="search u-search">
            <span class="ico-search">🔎</span>
            <input id="syncFilter" class="inp inp-search" type="text" placeholder="搜索同步项...">
          </div>
        </div>

        <div class="u-list" id="syncList"></div>

        <div class="u-policy">
          <div class="u-policy-title">未来的同步策略</div>
          <div class="u-policy-grid" role="radiogroup" aria-label="未来的同步策略">
            <label class="p-card">
              <input type="radio" name="syncPolicy" value="auto_selected" checked>
              <div class="p-main">
                <p class="p-name">以后自动同步已勾选的项目</p>
                <p class="p-desc">下次同步时：只同步您勾选的项目。</p>
              </div>
            </label>
            <label class="p-card">
              <input type="radio" name="syncPolicy" value="auto_all">
              <div class="p-main">
                <p class="p-name">以后都自动同步所有项目</p>
                <p class="p-desc">省心模式：默认勾选全部同步项。</p>
              </div>
            </label>
            <label class="p-card danger">
              <input type="radio" name="syncPolicy" value="never">
              <div class="p-main">
                <p class="p-name">以后都不同步</p>
                <p class="p-desc">保持本地文件不被覆盖。</p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn btn-sec" id="btnSyncCancel">取消</button>
        <button class="btn btn-primary" id="btnSyncGo">开始同步</button>
      </div>
    </div>
  </div>

  <!-- 更新弹窗（覆盖式，不跳转页面） -->
  <div class="modal" id="mdlUpdate" aria-hidden="true">
    <div class="modal-mask" data-act="close-update"></div>
    <div class="modal-panel modal-wide" role="dialog" aria-modal="true" aria-label="更新">
      <div class="modal-head">
        <div class="modal-head-left">
          <div class="modal-title">更新</div>
          <div class="modal-sub" id="updSub">检测新版本并更新程序文件</div>
        </div>
        <div class="modal-head-right">
          <span class="pill pill-muted" id="updVer">v-</span>
          <button class="btn btn-ghost" id="btnUpdCheck">检测更新</button>
          <button class="btn btn-ghost btn-sm" id="btnUpdClose">关闭</button>
        </div>
      </div>

      <div class="modal-body modal-scroll">
        <div class="u-row">
          <div class="pill pill-muted" id="updAt">未检测</div>
          <div class="u-actions">
            <span class="pill pill-muted" id="updMandatory" style="display:none;">强制更新</span>
          </div>
        </div>
        <div class="u-notes" id="updNotes"></div>

        <div class="u-list" id="updList"></div>

        <div class="u-policy">
          <div class="u-policy-title">更新策略</div>
          <div class="u-policy-grid" role="radiogroup" aria-label="更新策略">
            <label class="p-card">
              <input type="radio" name="updPolicy" value="auto">
              <div class="p-main">
                <p class="p-name">自动更新</p>
                <p class="p-desc">检测到更新后自动开始下载并更新。</p>
              </div>
            </label>
            <label class="p-card">
              <input type="radio" name="updPolicy" value="prompt" checked>
              <div class="p-main">
                <p class="p-name">更新时提醒我</p>
                <p class="p-desc">检测到更新后自动打开更新窗口，您确认后更新。</p>
              </div>
            </label>
            <label class="p-card danger">
              <input type="radio" name="updPolicy" value="never">
              <div class="p-main">
                <p class="p-name">不再更新</p>
                <p class="p-desc">不再检测更新，也不会覆盖任何文件。</p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn btn-sec" id="btnUpdCancel">取消</button>
        <button class="btn btn-primary" id="btnUpdGo">立即更新</button>
      </div>
    </div>
  </div>

  <!-- 日志右键菜单 -->
  <div class="ctx" id="logMenu">
    <div class="ctx-item" data-act="rm">尝试卸载(测试功能)</div>
    <div class="ctx-item" data-act="del">强制删除</div>
    <div class="ctx-item" data-act="addWhite">加入白名单</div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
